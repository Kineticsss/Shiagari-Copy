<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>SHIAGARI · Chats</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="message.css">
  <style>
    /* Extra chat styles */
    .chat-empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #6b7280;
      gap: 12px;
      padding: 40px;
    }
    .chat-empty-state i { font-size: 56px; opacity: .4; }
    .chat-empty-state p { font-size: 15px; }

    .chat-user-search {
      padding: 12px;
      border-bottom: 1px solid #1e2a3e;
    }
    .chat-user-search input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #2d3a5e;
      border-radius: 10px;
      padding: 8px 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .chat-user-search input:focus { border-color: #3b82f6; }

    .chat-user-meta { display: flex; flex-direction: column; min-width: 0; }
    .chat-user-preview { font-size: 11px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .message-date-divider {
      text-align: center;
      font-size: 11px;
      color: #6b7280;
      margin: 8px 0;
      position: relative;
    }
    .message-date-divider::before, .message-date-divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 30%;
      height: 1px;
      background: #1e2a3e;
    }
    .message-date-divider::before { left: 0; }
    .message-date-divider::after  { right: 0; }

    /* Loading overlay */
    .chat-loading {
      display: flex; align-items: center; justify-content: center;
      padding: 20px; color: #94a3b8; gap: 8px; font-size: 13px;
    }

    .online-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #10b981;
      display: inline-block; margin-right: 4px;
    }
    .offline-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #6b7280;
      display: inline-block; margin-right: 4px;
    }

    .no-users-found { padding: 16px; text-align: center; color: #6b7280; font-size: 13px; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <h1>SHIAGARI</h1>
    <nav>
      <a href="../landing/landing.html"><i class="fas fa-project-diagram"></i> <span>Projects</span></a>
      <a href="../idea/idea.html"><i class="fas fa-lightbulb"></i> <span>Idea Factory</span></a>
      <a href="../progress/progress.html"><i class="fas fa-chart-line"></i> <span>Progress Tracker</span></a>
      <a href="../roadmap/roadmap.html"><i class="fas fa-map"></i> <span>Roadmap</span></a>
      <a href="../postboard/postboard.html"><i class="fas fa-newspaper"></i> <span>Post Board</span></a>
      <a href="../message/message.html" class="active"><i class="fas fa-comments"></i> <span>Chats</span></a>
    </nav>
  </aside>

  <!-- ── Chat Sidebar (user list) ── -->
  <div class="chat-sidebar">
    <div class="chat-sidebar-header">
      <i class="fas fa-comments"></i> <span>Conversations</span>
    </div>
    <div class="chat-user-search">
      <input type="text" id="userSearchInput" placeholder="Search users…">
    </div>
    <div class="chat-list" id="chatList">
      <div class="chat-loading"><i class="fas fa-spinner fa-spin"></i> Loading users…</div>
    </div>
  </div>

  <!-- ── Chat Window ── -->
  <div class="chat-window" id="chatWindow">
    <header class="topbar">
      <h2><i class="fas fa-comments"></i> Chats</h2>
      <a href="../profile/profile.html" class="profile-button" id="topbarAvatar" title="Profile"><span>U</span></a>
    </header>

    <!-- Active chat header -->
    <div class="chat-header" id="chatHeader" style="display:none;">
      <div class="chat-user-info">
        <div class="chat-avatar" id="currentChatAvatar">?</div>
        <div>
          <span id="currentUserName" style="font-weight:600;">Select a chat</span>
          <div id="currentUserStatus" style="font-size:12px;color:#6b7280;margin-top:2px;"></div>
        </div>
      </div>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chatMessages">
      <div class="chat-empty-state">
        <i class="fas fa-comments"></i>
        <p>Select a conversation to start messaging</p>
      </div>
    </div>

    <!-- Input -->
    <div class="chat-input-area">
      <input type="text" id="messageInput" placeholder="Select a conversation first…" disabled>
      <button id="sendBtn" disabled><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <div id="toastMsg" class="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toastText">Message sent!</span>
  </div>

  <!-- Firebase SDKs (compat version - works with config from PHP) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script src="message.js"></script>
</body>
</html>
