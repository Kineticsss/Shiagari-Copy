<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>SHIAGARI · Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="profile.css">
</head>
<body>

  <aside class="sidebar">
    <h1>SHIAGARI</h1>
    <nav>
      <a href="../landing/landing.html"><i class="fas fa-project-diagram"></i> <span>Projects</span></a>
      <a href="../idea/idea.html"><i class="fas fa-lightbulb"></i> <span>Idea Factory</span></a>
      <a href="../progress/progress.html"><i class="fas fa-chart-line"></i> <span>Progress Tracker</span></a>
      <a href="../roadmap/roadmap.html"><i class="fas fa-map"></i> <span>Roadmap</span></a>
      <a href="../postboard/postboard.html"><i class="fas fa-newspaper"></i> <span>Post Board</span></a>
      <a href="../message/message.html"><i class="fas fa-comments"></i> <span>Chats</span></a>
      <a href="profile.html" class="active"><i class="fas fa-user-circle"></i> <span>Profile</span></a>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <h2><i class="fas fa-user-circle"></i> Profile</h2>
      <a href="profile.html" class="profile-button" id="topbarAvatar" title="Profile"><span>U</span></a>
    </header>

    <section class="profile-card">
      <div class="profile-avatar" id="profileAvatar">U</div>
      <div class="profile-content">
        <h3 id="profileFullName">Loading...</h3>
        <p class="profile-username" id="profileUsername">@...</p>
        <p class="profile-role" id="profileRole">Team Member</p>

        <div class="profile-details">
          <div>
            <span>Email</span>
            <strong id="profileEmail">...</strong>
          </div>
          <div>
            <span>Member since</span>
            <strong id="profileMemberSince">...</strong>
          </div>
          <div>
            <span>Role</span>
            <strong id="profileRoleDetail">...</strong>
          </div>
        </div>
        <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Log Out</button>
      </div>
    </section>
  </main>

  <script>
    // Base path detection - works whether app is at root or subdirectory
    function getBasePath() {
      // profile.html is at /profile/profile.html
      // API is at /api/profile.php relative to project root
      return '../';
    }

    async function loadUserProfile() {
      try {
        const response = await fetch(getBasePath() + 'api/profile.php', {
          method: 'GET',
          credentials: 'same-origin',
          headers: { 'Accept': 'application/json' }
        });

        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }

        const result = await response.json();

        // API returns { success: true, user: {...} }
        if (result.success && result.user) {
          populateProfile(result.user);
          // Cache to localStorage as backup
          cacheUserToLocalStorage(result.user);
          return;
        }

        // Not authenticated — redirect to login
        if (response.status === 401 || (result && result.error === 'Not authenticated')) {
          window.location.href = getBasePath() + 'index.php';
          return;
        }

        throw new Error(result.error || 'Failed to load profile');
      } catch (error) {
        console.warn('API profile load failed, trying localStorage fallback:', error.message);
        fallbackToLocalStorage();
      }
    }

    function cacheUserToLocalStorage(user) {
      if (user.full_name) localStorage.setItem('shiagari_user_full_name', user.full_name);
      if (user.username)  localStorage.setItem('shiagari_user_username', user.username);
      if (user.email)     localStorage.setItem('shiagari_user_email', user.email);
      if (user.member_since) localStorage.setItem('shiagari_user_member_since', user.member_since);
      if (user.role)      localStorage.setItem('shiagari_user_role', user.role);
    }

    function fallbackToLocalStorage() {
      const fullName    = localStorage.getItem('shiagari_user_full_name') || localStorage.getItem('shiagari_user_name') || 'User';
      const username    = localStorage.getItem('shiagari_user_username') || '';
      const email       = localStorage.getItem('shiagari_user_email') || '';
      const memberSince = localStorage.getItem('shiagari_user_member_since') || '';
      const role        = localStorage.getItem('shiagari_user_role') || 'user';

      populateProfile({ full_name: fullName, username, email, member_since: memberSince, role });
    }

    function populateProfile(user) {
      const fullName    = user.full_name    || 'User';
      const username    = user.username     || '';
      const email       = user.email        || '';
      const memberSince = user.member_since || '';
      const role        = user.role         || 'user';

      const initials = fullName
        .split(' ')
        .filter(Boolean)
        .slice(0, 2)
        .map(s => s[0].toUpperCase())
        .join('') || 'U';

      document.getElementById('profileAvatar').textContent      = initials;
      document.getElementById('topbarAvatar').querySelector('span').textContent = initials;
      document.getElementById('profileFullName').textContent    = fullName;
      document.getElementById('profileUsername').textContent    = username ? '@' + username : '';
      document.getElementById('profileEmail').textContent       = email;
      document.getElementById('profileMemberSince').textContent = memberSince;
      document.getElementById('profileRoleDetail').textContent  = role.charAt(0).toUpperCase() + role.slice(1);
      document.getElementById('profileRole').textContent        = role.charAt(0).toUpperCase() + role.slice(1);
    }

    document.getElementById('logoutBtn').addEventListener('click', function () {
      if (confirm('Are you sure you want to log out?')) {
        localStorage.clear();
        window.location.href = getBasePath() + 'auth/logout.php';
      }
    });

    document.addEventListener('DOMContentLoaded', loadUserProfile);
  </script>
</body>
</html>
