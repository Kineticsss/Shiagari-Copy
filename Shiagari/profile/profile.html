<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>SHIAGARI · Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="profile.css">
  <style>
    /* ── Avatar upload ─────────────────────────────────────────────────────── */
    .avatar-wrap {
      position: relative;
      width: 180px;
      height: 180px;
      flex-shrink: 0;
    }

    .profile-avatar {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: #111827;
      border: 1px solid #1f2a40;
      display: grid;
      place-items: center;
      font-size: 72px;
      color: #fff;
      font-weight: 800;
      overflow: hidden;
      transition: filter 0.2s ease;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    /* Hover camera overlay */
    .avatar-overlay {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      opacity: 0;
      cursor: pointer;
      transition: opacity 0.2s ease;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      user-select: none;
    }

    .avatar-overlay i { font-size: 28px; }

    .avatar-wrap:hover .avatar-overlay      { opacity: 1; }
    .avatar-wrap:hover .profile-avatar      { filter: brightness(0.6); }
    .avatar-wrap.drag-over .avatar-overlay  { opacity: 1; outline: 3px solid #3b82f6; border-radius: 50%; }

    /* Spinner shown while uploading */
    .avatar-progress {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
    }
    .avatar-progress.visible { display: flex; }

    .spinner-ring {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error label under avatar */
    .avatar-error {
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 11px;
      color: #f87171;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      padding: 3px 12px;
      border-radius: 20px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .avatar-error.visible { opacity: 1; }

    #avatarFileInput { display: none; }

    /* Give the profile card a bit more room */
    .profile-card { align-items: flex-start; padding-bottom: 48px; }

    /* Toast (self-contained, no external CSS needed) */
    #toastMsg {
      position: fixed; bottom: 30px; right: 30px;
      background: #1e293b; padding: 12px 20px; border-radius: 40px;
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; font-weight: 500;
      border-left: 4px solid #10b981;
      transform: translateX(400px); transition: transform .3s ease; z-index: 1100;
    }
    #toastMsg.show { transform: translateX(0); }
  </style>
</head>
<body>

  <aside class="sidebar">
    <h1>SHIAGARI</h1>
    <nav>
      <a href="../landing/landing.php"><i class="fas fa-project-diagram"></i> <span>Projects</span></a>
      <a href="../idea/idea.php"><i class="fas fa-lightbulb"></i> <span>Idea Factory</span></a>
      <a href="../progress/progress.php"><i class="fas fa-chart-line"></i> <span>Progress Tracker</span></a>
      <a href="../roadmap/roadmap.php"><i class="fas fa-map"></i> <span>Roadmap</span></a>
      <a href="../postboard/postboard.php"><i class="fas fa-newspaper"></i> <span>Post Board</span></a>
      <a href="../message/message.php"><i class="fas fa-comments"></i> <span>Chats</span></a>
      <a href="profile.html" class="active"><i class="fas fa-user-circle"></i> <span>Profile</span></a>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <h2><i class="fas fa-user-circle"></i> Profile</h2>
      <a href="profile.html" class="profile-button" title="Profile">
        <span id="profileBtnInitial">U</span>
      </a>
    </header>

    <section class="profile-card">

      <!-- Avatar column -->
      <div class="avatar-wrap" id="avatarWrap">

        <div class="profile-avatar" id="profileAvatar">U</div>

        <div class="avatar-overlay" id="avatarOverlay"
             role="button" tabindex="0" aria-label="Change profile photo">
          <i class="fas fa-camera"></i>
          Change photo
        </div>

        <div class="avatar-progress" id="avatarProgress" aria-live="polite">
          <div class="spinner-ring"></div>
          <span>Uploading…</span>
        </div>

        <div class="avatar-error" id="avatarError"></div>

        <input type="file" id="avatarFileInput"
               accept="image/jpeg,image/png,image/webp,image/gif">
      </div>

      <!-- Info column -->
      <div class="profile-content">
        <h3 id="profileFullName">Loading…</h3>
        <p class="profile-username" id="profileUsername">@…</p>
        <p class="profile-role">Product enthusiast · Project lead</p>

        <div class="profile-details">
          <div><span>Email</span><strong id="profileEmail">…</strong></div>
          <div><span>Member since</span><strong id="profileMemberSince">…</strong></div>
        </div>

        <button id="logoutBtn" class="logout-btn" disabled>
          <i class="fas fa-sign-out-alt"></i> Log Out
        </button>
      </div>

    </section>
  </main>

  <div id="toastMsg">
    <i class="fas fa-check-circle" style="color:#10b981"></i>
    <span id="toastText">Done!</span>
  </div>

  <script>
  // ════════════════════════════════════════════════════════
  //  CACHE
  // ════════════════════════════════════════════════════════
  const CACHE_KEYS = [
    'shiagari_user_uid','shiagari_user_email',
    'shiagari_user_full_name','shiagari_user_username',
    'shiagari_user_created_at','shiagari_user_member_since',
    'shiagari_user_verified','shiagari_user_name',
    'shiagari_user_photo_url',
  ];

  function clearCache() { CACHE_KEYS.forEach(k => localStorage.removeItem(k)); }

  function setCache(p) {
    localStorage.setItem('shiagari_user_uid',       p.uid      || '');
    localStorage.setItem('shiagari_user_email',     p.email    || '');
    localStorage.setItem('shiagari_user_full_name', p.fullName || '');
    localStorage.setItem('shiagari_user_username',  p.username || '');
    localStorage.setItem('shiagari_user_verified',  'true');
    if (p.photoURL)   localStorage.setItem('shiagari_user_photo_url',    p.photoURL);
    if (p.createdAt) {
      localStorage.setItem('shiagari_user_created_at', p.createdAt);
      const d = new Date(p.createdAt);
      localStorage.setItem('shiagari_user_member_since',
        isNaN(d) ? p.createdAt : d.toLocaleString('default',{month:'long',year:'numeric'}));
    }
  }

  // ════════════════════════════════════════════════════════
  //  HELPERS
  // ════════════════════════════════════════════════════════
  function initials(name) {
    if (!name || !name.trim()) return 'U';
    return name.trim().split(/\s+/).filter(Boolean)
      .slice(0,2).map(w=>w[0].toUpperCase()).join('') || 'U';
  }

  function escAttr(s) {
    return String(s||'').replace(/[&"<>]/g,c=>({'&':'&amp;','"':'&quot;','<':'&lt;','>':'&gt;'}[c]));
  }

  let _toastTimer = null;
  function showToast(msg, type='success') {
    const toast = document.getElementById('toastMsg');
    const icon  = toast.querySelector('i');
    document.getElementById('toastText').textContent = msg;
    const colors = {success:'#10b981', error:'#f97316', warning:'#fbbf24'};
    const icons  = {success:'fa-check-circle', error:'fa-exclamation-triangle', warning:'fa-exclamation-circle'};
    icon.className = `fas ${icons[type]||icons.success}`;
    icon.style.color = colors[type]||colors.success;
    toast.classList.add('show');
    if (_toastTimer) clearTimeout(_toastTimer);
    _toastTimer = setTimeout(()=>toast.classList.remove('show'), 3200);
  }

  // ════════════════════════════════════════════════════════
  //  RENDER
  // ════════════════════════════════════════════════════════
  function renderProfile(p) {
    const fullName = (p.fullName||'').trim() || (p.email||'').split('@')[0] || 'Unknown';
    const username = (p.username||'').trim() || fullName.toLowerCase().replace(/\s+/g,'_');
    const email    = p.email || '—';
    const since    = (() => {
      const raw = p.createdAt || localStorage.getItem('shiagari_user_member_since');
      if (!raw) return '—';
      const d = new Date(raw);
      return isNaN(d)?raw:d.toLocaleString('default',{month:'long',year:'numeric'});
    })();

    const ini = initials(fullName);
    document.getElementById('profileBtnInitial').textContent  = ini;
    document.getElementById('profileFullName').textContent    = fullName;
    document.getElementById('profileUsername').textContent    = `@${username}`;
    document.getElementById('profileEmail').textContent       = email;
    document.getElementById('profileMemberSince').textContent = since;

    setAvatarImage(p.photoURL || localStorage.getItem('shiagari_user_photo_url') || '', fullName);
  }

  function setAvatarImage(url, fullName) {
    const el  = document.getElementById('profileAvatar');
    const ini = initials(fullName || localStorage.getItem('shiagari_user_full_name') || 'U');
    if (url) {
      el.innerHTML = `<img src="${escAttr(url)}" alt="${escAttr(fullName||'')}"
        onerror="this.parentElement.innerHTML='${ini}'">`;
    } else {
      el.textContent = ini;
    }
  }

  // ════════════════════════════════════════════════════════
  //  CSRF  (fetched from dedicated lightweight endpoint)
  // ════════════════════════════════════════════════════════
  let _csrf = '';

  async function ensureCsrf() {
    if (_csrf) return _csrf;
    try {
      const r = await fetch('../api/csrf-token.php', {
        credentials: 'same-origin',
        headers: { 'Accept': 'application/json' },
      });
      const d = await r.json();
      _csrf = d.csrf_token || '';
    } catch(_) {}
    return _csrf;
  }

  // ════════════════════════════════════════════════════════
  //  BOOTSTRAP (load profile from server)
  // ════════════════════════════════════════════════════════
  async function bootstrapProfile() {
    const logoutBtn = document.getElementById('logoutBtn');
    try {
      const res = await fetch('../api/user-profile.php', {
        method: 'GET',
        headers: { 'Accept': 'application/json' },
        credentials: 'same-origin',
      });

      if (res.status === 401) { clearCache(); window.location.href='../index.php'; return; }

      const result = await res.json().catch(()=>({}));

      if (!result.success || !result.profile) {
        const cn = localStorage.getItem('shiagari_user_full_name');
        const ce = localStorage.getItem('shiagari_user_email');
        if (cn||ce) {
          renderProfile({
            fullName:  cn||'', username: localStorage.getItem('shiagari_user_username')||'',
            email:ce||'', createdAt:localStorage.getItem('shiagari_user_created_at')||'',
            photoURL:  localStorage.getItem('shiagari_user_photo_url')||'',
          });
        } else { clearCache(); window.location.href='../index.php'; }
        return;
      }

      setCache(result.profile);
      renderProfile(result.profile);
    } catch(e) {
      console.error('bootstrapProfile:', e);
      const cn = localStorage.getItem('shiagari_user_full_name');
      if (cn) {
        renderProfile({
          fullName:cn, username:localStorage.getItem('shiagari_user_username')||'',
          email:localStorage.getItem('shiagari_user_email')||'',
          createdAt:localStorage.getItem('shiagari_user_created_at')||'',
          photoURL:localStorage.getItem('shiagari_user_photo_url')||'',
        });
      } else { window.location.href='../index.php'; }
    } finally {
      if (logoutBtn) logoutBtn.disabled = false;
    }
  }

  // ════════════════════════════════════════════════════════
  //  PHOTO UPLOAD
  // ════════════════════════════════════════════════════════
  const MAX_BYTES    = 5 * 1024 * 1024;
  const ALLOWED_MIME = ['image/jpeg','image/png','image/webp','image/gif'];

  function showAvatarError(msg) {
    const el = document.getElementById('avatarError');
    el.textContent = msg;
    el.classList.add('visible');
    setTimeout(()=>el.classList.remove('visible'), 4000);
  }

  function setUploading(on) {
    document.getElementById('avatarProgress').classList.toggle('visible', on);
    document.getElementById('avatarOverlay').style.pointerEvents = on ? 'none' : '';
    document.getElementById('avatarFileInput').disabled = on;
  }

  async function uploadAvatar(file) {
    // Client-side validation first
    if (!ALLOWED_MIME.includes(file.type)) {
      showAvatarError('Only JPEG, PNG, WebP or GIF allowed.'); return;
    }
    if (file.size > MAX_BYTES) {
      showAvatarError('File too large — max 5 MB.'); return;
    }

    // Optimistic preview
    const previewURL = URL.createObjectURL(file);
    const avatarEl   = document.getElementById('profileAvatar');
    const prevHTML   = avatarEl.innerHTML;
    avatarEl.innerHTML = `<img src="${previewURL}" alt="Preview" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;

    setUploading(true);

    try {
      const csrf = await ensureCsrf();

      const form = new FormData();
      form.append('avatar', file);
      form.append('csrf_token', csrf);

      const res = await fetch('../storage/upload.php', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'X-CSRF-Token': csrf },   // send in both places for flexibility
        body: form,
      });

      const result = await res.json().catch(()=>({}));

      if (!result.success) {
        avatarEl.innerHTML = prevHTML;
        URL.revokeObjectURL(previewURL);
        showAvatarError(result.error || 'Upload failed.');
        showToast(result.error || 'Upload failed.', 'error');
        return;
      }

      // Commit: replace with real Firebase URL
      const photoURL = result.photoURL;
      localStorage.setItem('shiagari_user_photo_url', photoURL);
      URL.revokeObjectURL(previewURL);

      const fullName = document.getElementById('profileFullName').textContent;
      setAvatarImage(photoURL, fullName);

      showToast(result.warning ? result.warning : 'Profile photo updated!',
                result.warning ? 'warning' : 'success');

    } catch(err) {
      console.error('uploadAvatar:', err);
      avatarEl.innerHTML = prevHTML;
      URL.revokeObjectURL(previewURL);
      showAvatarError('Network error — please try again.');
      showToast('Network error during upload.', 'error');
    } finally {
      setUploading(false);
    }
  }

  // ════════════════════════════════════════════════════════
  //  EVENT WIRING
  // ════════════════════════════════════════════════════════
  function initUpload() {
    const overlay   = document.getElementById('avatarOverlay');
    const fileInput = document.getElementById('avatarFileInput');
    const wrap      = document.getElementById('avatarWrap');

    // Click or keyboard → open picker
    overlay.addEventListener('click',   ()  => fileInput.click());
    overlay.addEventListener('keydown', e   => {
      if (e.key==='Enter'||e.key===' ') { e.preventDefault(); fileInput.click(); }
    });

    // File selected
    fileInput.addEventListener('change', () => {
      const f = fileInput.files[0];
      if (f) uploadAvatar(f);
      fileInput.value = '';   // allow re-selecting same file
    });

    // Drag-and-drop directly onto avatar
    wrap.addEventListener('dragover',  e  => { e.preventDefault(); wrap.classList.add('drag-over'); });
    wrap.addEventListener('dragleave', () => wrap.classList.remove('drag-over'));
    wrap.addEventListener('drop', e => {
      e.preventDefault();
      wrap.classList.remove('drag-over');
      const f = e.dataTransfer.files[0];
      if (f) uploadAvatar(f);
    });
  }

  document.getElementById('logoutBtn').addEventListener('click', () => {
    if (!confirm('Are you sure you want to log out?')) return;
    clearCache();
    window.location.href = '../auth/logout.php';
  });

  document.addEventListener('DOMContentLoaded', () => {
    bootstrapProfile();
    initUpload();
  });
  </script>
