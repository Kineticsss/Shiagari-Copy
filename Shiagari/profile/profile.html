<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>SHIAGARI · Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="profile.css">
</head>
<body>

  <aside class="sidebar">
    <h1>SHIAGARI</h1>
    <nav>
      <a href="../landing/landing.php"><i class="fas fa-project-diagram"></i> <span>Projects</span></a>

      <a href="../idea/idea.php"><i class="fas fa-lightbulb"></i> <span>Idea Factory</span></a>
      <a href="../progress/progress.php"><i class="fas fa-chart-line"></i> <span>Progress Tracker</span></a>
      <a href="../roadmap/roadmap.php"><i class="fas fa-map"></i> <span>Roadmap</span></a>
      <a href="../postboard/postboard.php"><i class="fas fa-newspaper"></i> <span>Post Board</span></a>
      <a href="../message/message.php"><i class="fas fa-comments"></i> <span>Chats</span></a>
      <a href="profile.html" class="active"><i class="fas fa-user-circle"></i> <span>Profile</span></a>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <h2><i class="fas fa-user-circle"></i> Profile</h2>
      <a href="profile.html" class="profile-button" title="Profile"><span>U</span></a>
    </header>

    <section class="profile-card">
      <div class="profile-avatar">U</div>
      <div class="profile-content">
        <h3 id="profileFullName">Creative User</h3>
        <p class="profile-username" id="profileUsername">@creative_user</p>
        <p class="profile-role">Product enthusiast · Project lead</p>

        <div class="profile-details">
          <div>
            <span>Email</span>
            <strong id="profileEmail">user@example.com</strong>
          </div>
          <div>
            <span>Member since</span>
            <strong id="profileMemberSince">May 2026</strong>
          </div>
          <div>
            <span>Teams</span>
            <strong>Design, Product, Growth</strong>
          </div>
        </div>
        <button id="logoutBtn" class="logout-btn">Log Out</button>
      </div>
    </section>
  </main>

  <script>
    // Profile UI must reflect the currently authenticated user.
    // localStorage is treated as a cache only (never authority).

    const profileKeys = [
      'shiagari_user_uid',
      'shiagari_user_email',
      'shiagari_user_full_name',
      'shiagari_user_username',
      'shiagari_user_created_at',
      'shiagari_user_member_since',
      'shiagari_user_verified',
      'shiagari_user_name'
    ];

    function clearProfileCache() {
      for (const k of profileKeys) {
        localStorage.removeItem(k);
      }
    }

    function setProfileCache(profile) {
      // Overwrite cache with server-verified values.
      localStorage.setItem('shiagari_user_uid', profile.uid || '');
      localStorage.setItem('shiagari_user_email', profile.email || '');
      localStorage.setItem('shiagari_user_full_name', profile.fullName || '');
      localStorage.setItem('shiagari_user_username', profile.username || '');
      localStorage.setItem('shiagari_user_created_at', profile.createdAt || profile.created_at || new Date().toISOString());
      if (profile.createdAt) {
        const d = new Date(profile.createdAt);
        const member = Number.isNaN(d.getTime())
          ? profile.createdAt
          : d.toLocaleString('default', { month: 'long', year: 'numeric' });
        localStorage.setItem('shiagari_user_member_since', member);
      }
      localStorage.setItem('shiagari_user_verified', 'true');
    }

    function renderProfile(profile) {
      const fullName = profile.fullName || 'Creative User';
      const username = profile.username || (fullName || 'creative_user').trim().toLowerCase().replace(/\s+/g, '_');
      const email = profile.email || 'user@example.com';
      const memberSince = profile.createdAt
        ? new Date(profile.createdAt).toLocaleString('default', { month: 'long', year: 'numeric' })
        : (localStorage.getItem('shiagari_user_member_since') || 'May 2026');

      const initials = (fullName || 'U')
        .split(' ')
        .filter(Boolean)
        .slice(0, 2)
        .map((segment) => segment[0].toUpperCase())
        .join('') || 'U';

      document.querySelector('.profile-avatar').textContent = initials;
      document.querySelector('.profile-button span').textContent = initials;
      document.getElementById('profileFullName').textContent = fullName;
      document.getElementById('profileUsername').textContent = `@${username}`;
      document.getElementById('profileEmail').textContent = email;
      document.getElementById('profileMemberSince').textContent = memberSince;
    }

    async function bootstrapProfile() {
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) logoutBtn.disabled = true;

      try {
        // Use server API as source of truth.
        const res = await fetch('../api/user-profile.php', {
          method: 'GET',
          headers: { 'Accept': 'application/json' },
          credentials: 'same-origin'
        });

        const result = await res.json().catch(() => ({}));

        if (!res.ok || !result.success || !result.profile) {
          clearProfileCache();
          // redirect only after auth/profile failure is known
          window.location.href = '../index.php';
          return;
        }

        setProfileCache(result.profile);
        renderProfile(result.profile);
      } catch (e) {
        clearProfileCache();
        window.location.href = '../index.php';
      } finally {
        if (logoutBtn) logoutBtn.disabled = false;
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', function() {
      const confirmed = confirm('Are you sure you want to log out?');
      if (!confirmed) return;
      // Clear cache immediately so UI never briefly shows stale profile.
      clearProfileCache();
      window.location.href = '../auth/logout.php';
    });

    document.addEventListener('DOMContentLoaded', bootstrapProfile);
  </script>
</body>
</html>
